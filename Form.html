 <h1>Anime Survey</h1>
 <form>
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname"><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname">
</form><br>
Favorite Anime Genre:<br>
<select name="anime_genre" id="anime_genre">
  <option value="action">Action</option>
  <option value="comedy">Comedy</option>
  <option value="drama">Drama</option>
  <option value="fantasy">Fantasy</option>
  <option value="horror">Horror</option>
  <option value="romance">Romance</option>
  <option value="sci-fi">Sci-Fi</option>
  <option value="slice_of_life">Slice of Life</option>
  <option value="sports">Sports</option>
  <option value="supernatural">Supernatural</option>
</select>

 <p>Years of Anime Watching Experience:</p>

<form>
  <input type="radio" id="0-2" name="Years_of_Experience" value="0-2">
  <label for="0-2">0-2 years</label><br>
  <input type="radio" id="3-5" name="Years_of_Experience" value="3-5">
  <label for="3-5">3-5 years</label><br>
  <input type="radio" id="6-10" name="Years_of_Experience" value="6-10">
  <label for="6-10">6-10 years</label><br>
  <input type="radio" id="10plus" name="Years_of_Experience" value="10+">
  <label for="10plus">10+ years</label>
</form>
